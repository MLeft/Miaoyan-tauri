<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<style>
  /* Critical styles to prevent flash */
  :root {
    --bg-color: #FFFFFF;
    --text-color: #262626;
    --code-bg: #f7f7f7;
    --diagram-bg: #f7f7f7;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #23282D;
      --text-color: #E7E9EA;
      --code-bg: #282e33;
      --diagram-bg: #282e33;
    }
  }

  .darkmode {
    --bg-color: #23282D;
    --text-color: #E7E9EA;
    --code-bg: #282e33;
    --diagram-bg: #282e33;
  }

  html, body {
    background: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
  }

  img {
    image-rendering: auto;
    color-scheme: only light;
    image-orientation: from-image;
    max-width: 100%;
    height: auto;
  }

  @font-face {
    font-family: 'TsangerJinKai02-W04';
    font-display: fallback;
    /* 子集化 woff2（基于全部笔记实际字符集，覆盖 1956 字符）：
       原全量 ttf 18MB，每次预览加载都要下载+解析，是打开/切换笔记卡顿的重要原因；
       子集外字符由字体链中的系统字体兼容回退 */
    src: url('/fonts/TsangerJinKai02-W04-subset.woff2') format('woff2');
  }

  #write { margin: 0; max-width: 100%; padding: 0 28px 80px; box-sizing: border-box; }

  /* Annotation highlights */
  .ann-hl {
    background: rgba(214,158,46,.18);
    border-bottom: 2px solid #d69e2e;
    border-radius: 2px;
    cursor: pointer;
    padding: 1px 0;
    transition: background .2s;
  }
  .ann-hl:hover { background: rgba(214,158,46,.32); }
  .ann-hl-resolved {
    background: rgba(72,187,120,.12);
    border-bottom: 2px solid #48bb78;
  }
  /* Annotation action popup
     用固定高对比配色而非主题变量：HTML 文件内容自带的样式会污染 iframe 内的变量/按钮样式 */
  .ann-popup {
    position: fixed;
    display: flex;
    gap: 1px;
    background: #ffffff !important;
    border: 1px solid #d8d8d8 !important;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    z-index: 9999;
    overflow: hidden;
    animation: ann-popup-in .12s ease-out;
  }
  .darkmode .ann-popup {
    background: #2d333b !important;
    border-color: #444c56 !important;
  }
  @keyframes ann-popup-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ann-popup button {
    padding: 5px 12px;
    font-size: 12px;
    border: none;
    background: transparent !important;
    color: #24292f !important;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .darkmode .ann-popup button {
    color: #e6e8eb !important;
  }
  .ann-popup button:hover {
    background: #f0f0f0 !important;
  }
  .darkmode .ann-popup button:hover {
    background: #373e47 !important;
  }
  .ann-popup button + button {
    border-left: 1px solid #d8d8d8 !important;
  }
  .darkmode .ann-popup button + button {
    border-left-color: #444c56 !important;
  }
</style>

<script defer src="/js/highlight.min.js"></script>

<!-- mermaid/katex/auto-render/d3/markmap/markmap-view/plantuml-encoder 共约 3.9MB，
     改为 setContent 时按内容特征动态注入（见 body 内 ensureLib），
     无图表/数学公式的文档不再解析这些脚本 -->
</head>

<body>
<div class="toc-hover-trigger"></div>
<nav class="toc-nav">
  <div class="toc-content"></div>
  <button class="toc-pin-btn" title="Pin TOC" aria-label="Pin TOC">
    <svg class="pin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 9V4a2 2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v5m0 0l-2 2v2h12v-2l-2-2m-8 0h8m-4 6v7" />
    </svg>
  </button>
</nav>
<div class="markdown-body heti" id="write"></div>

<script>
/* ---- Bridge for parent frame ---- */
var _pendingHtml = '';
var _pendingDark = false;
var _libsReady = false;
var _domReady = false;
var _rawMode = false; /* HTML 文件原始渲染模式：跳过 Markdown 后处理 */
var _hasMath = false; /* 内容是否含数学符号：无则跳过 KaTeX 全文遍历 */
var _tocTimer = null; /* tocbot 重建防抖计时器 */

/* ── 按需加载重型库（mermaid/katex/markmap/plantuml 共约 3.9MB）──
   setContent 时按内容特征判断需要哪些库，动态注入脚本；
   doRender 等待所需库就绪后再跑后处理链 */
var _neededLibs = {};
var _loadingLibs = {};

var LIB_SCRIPTS = {
  mermaid: ['/js/mermaid.min.js'],
  plantuml: ['/js/plantuml-encoder.min.js'],
  math: ['/js/katex.min.js', '/js/auto-render.min.js'],
  markmap: ['/js/d3.min.js', '/js/markmap.min.js', '/js/markmap-view.min.js']
};

function libPresent(name) {
  if (name === 'mermaid') return !!window.mermaid;
  if (name === 'plantuml') return !!window.plantumlEncoder;
  if (name === 'math') return !!window.renderMathInElement;
  if (name === 'markmap') return !!(window.markmap && window.markmap.autoLoader);
  return true;
}

/* 按依赖顺序链式注入：前一个脚本 onload 后再注入下一个
   （markmap 依赖 d3，auto-render 依赖 katex，并行注入无法保证执行顺序） */
function loadScriptChain(srcs, idx) {
  if (idx >= srcs.length) return;
  var s = document.createElement('script');
  s.src = srcs[idx];
  s.onload = function() { loadScriptChain(srcs, idx + 1); };
  document.head.appendChild(s);
}

function ensureLibs(names) {
  names.forEach(function(name) {
    _neededLibs[name] = true;
    if (libPresent(name) || _loadingLibs[name]) return;
    _loadingLibs[name] = true;
    loadScriptChain(LIB_SCRIPTS[name], 0);
  });
}

function neededLibsLoaded() {
  for (var name in _neededLibs) {
    if (_neededLibs[name] && !libPresent(name)) return false;
  }
  return true;
}

/* 按内容特征判定需要哪些重型库（在 html 字符串上判断，零 DOM 开销） */
function detectNeededLibs(html) {
  var names = [];
  if (html.indexOf('language-mermaid') !== -1) names.push('mermaid');
  if (html.indexOf('language-plantuml') !== -1) names.push('plantuml');
  if (html.indexOf('language-markmap') !== -1) names.push('markmap');
  if (_hasMath) names.push('math');
  return names;
}

function applyTheme(isDark) {
  document.documentElement.classList.toggle('darkmode', isDark);
  document.body.classList.toggle('darkmode', isDark);
  var write = document.getElementById('write');
  if (write) write.classList.toggle('darkmode', isDark);
  if (window.ThemeConfig) {
    window.ThemeConfig.applyCSSVariables(isDark);
    if (isDark) window.ThemeConfig.applyDarkModeStyles();
  }
}

function applyPreviewWidth(width) {
  var write = document.getElementById('write');
  if (!write) return;
  if (width === 'full') {
    write.style.maxWidth = '100%';
  } else {
    write.style.maxWidth = width + 'px';
  }
}

function doRender() {
  if (!window.MiaoYanCommon || !window.DiagramHandler) {
    /* Defer scripts may not have executed yet, retry */
    setTimeout(doRender, 100);
    return;
  }
  /* 所需重型库尚未加载完成时延后：保证 mermaid/KaTeX 等后处理不因
     动态注入的异步性而漏渲染 */
  if (!neededLibsLoaded()) {
    setTimeout(doRender, 50);
    return;
  }

  MiaoYanCommon.initializeCore();
  MiaoYanCommon.setupInteractiveCheckboxes();
  MiaoYanCommon.setupHeaderAnchors();
  MiaoYanCommon.setupFootnoteLinks();
  MiaoYanCommon.optimizeImages();
  MiaoYanCommon.setupImageZoom();
  DiagramHandler.initializeAll();

  if (window.renderMathInElement && _hasMath) {
    var write = document.getElementById('write');
    var renderMath = function() {
      /* 只扫描 #write 而非 document.body，避免遍历 TOC 等外围 DOM */
      renderMathInElement(write, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        processEscapes: true,
        ignoredClasses: ['katex-display', 'katex', 'skip-math-dollar']
      });
    };
    if ('requestIdleCallback' in window) {
      requestIdleCallback(renderMath, { timeout: 200 });
    } else {
      setTimeout(renderMath, 0);
    }
  }
  window.parent.postMessage({ type: 'preview-rendered' }, '*');
  // Rebuild scroll anchors after all content (including diagrams/math) is ready
  if (window.__miaoyanSync) {
    setTimeout(function() { window.__miaoyanSync.rebuild(); }, 150);
  }
  // Refresh TOC to match new content (tab switch)
  // 防抖：打字触发的连续 setContent 只在停顿后重建一次 TOC
  if (window.tocbot && document.querySelector('.toc-nav')) {
    if (_tocTimer !== null) clearTimeout(_tocTimer);
    _tocTimer = setTimeout(function() {
      _tocTimer = null;
      var tocHeadings = document.querySelectorAll('#write h1, #write h2, #write h3');
      var tocTrigger = document.querySelector('.toc-hover-trigger');
      try { tocbot.destroy(); } catch(e) {}
      if (tocHeadings.length >= 2) {
        if (tocTrigger) tocTrigger.style.display = '';
        tocbot.init({
          tocSelector: '.toc-content',
          contentSelector: '#write',
          headingSelector: 'h1, h2, h3',
          hasInnerContainers: true,
          collapseDepth: 3,
          scrollSmooth: true,
          scrollSmoothDuration: 200,
          headingsOffset: 80,
          ignoreHiddenElements: true
        });
      } else {
        if (tocTrigger) tocTrigger.style.display = 'none';
      }
    }, 300);
  }
}

function setContent(html, isDark, previewWidth) {
  _pendingDark = isDark;
  applyTheme(isDark);
  if (previewWidth) applyPreviewWidth(previewWidth);

  var write = document.getElementById('write');
  if (!write) { _pendingHtml = html; return; }

  /* innerHTML 整段替换会销毁全部旧子节点：data-processed 标记、mermaid SVG、
     批注高亮都随 DOM 一起消失，无需逐一遍历清理。
     DiagramHandler._svgCache 按内容 hash 索引，予以保留，
     未变更的图表下次渲染可直接命中缓存 */

  /* 数学短路：文档不含数学符号时跳过 KaTeX 的全文本节点遍历 */
  _hasMath = !_rawMode && (
    html.indexOf('$') !== -1 ||
    html.indexOf('\\(') !== -1 ||
    html.indexOf('\\[') !== -1
  );
  /* 供 common.js 的 escapeCurrencyLikeMath（KaTeX 预处理）复用同一短路 */
  window._hasMathHint = _hasMath;

  /* emoji 短路：不含 ':' 时跳过 emoji shortcode 的全文本节点遍历 */
  window._hasEmojiHint = html.indexOf(':') !== -1;

  /* WikiLinks：在字符串上预转换 [[title]] 为 span，
     避免先写 DOM 再读回 innerHTML 造成的二次全文序列化 */
  if (!_rawMode && html.indexOf('[[') !== -1) {
    html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink" data-title="$1">$1</span>');
  }

  write.innerHTML = html;

  /* 原始 HTML 模式：跳过 WikiLink/图表等 Markdown 专属后处理，保留批注模块可用 */
  if (_rawMode) return;

  /* 按内容特征注入所需重型库（无图表/数学公式的文档零加载） */
  ensureLibs(detectNeededLibs(html));

  /* WikiLinks 点击导航 */
  write.querySelectorAll('.wikilink').forEach(function(el) {
    el.addEventListener('click', function() {
      window.parent.postMessage({ type: 'wikilink-navigate', title: el.dataset.title }, '*');
    });
  });

  doRender();
}

/* ---- DOMContentLoaded initialization (matches original flow) ---- */
document.addEventListener('DOMContentLoaded', function() {
  _domReady = true;
  /* If content was already sent, render it now */
  if (_pendingHtml) {
    setContent(_pendingHtml, _pendingDark);
  }
});

/* ---- Scroll sync (VS Code algorithm, same as original MiaoYan) ---- */
(function() {
  var anchors = [];
  var rebuildTimer = null;
  var rafId = null;
  var lastReportedLine = -1;
  var suppressUntil = 0; // timestamp until which we suppress scroll reporting

  function rebuildAnchors() {
    var els = document.querySelectorAll('[data-sourcepos]');
    var result = [];
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.offsetHeight === 0) continue;
      if (el.offsetParent === null && el !== document.body) continue;
      var attr = el.getAttribute('data-sourcepos');
      if (!attr) continue;
      var line = parseInt(attr, 10);
      if (isNaN(line) || line < 1) continue;
      var top = el.getBoundingClientRect().top + window.scrollY;
      result.push({ line: line, top: top });
    }
    result.sort(function(a, b) { return a.line - b.line; });
    anchors = result;
  }

  function scheduleRebuild() {
    if (rebuildTimer !== null) clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(function() {
      rebuildTimer = null;
      rebuildAnchors();
    }, 100);
  }

  function lineForScroll(scrollY) {
    if (anchors.length === 0) return 0;
    if (scrollY <= anchors[0].top) return anchors[0].line;
    var last = anchors[anchors.length - 1];
    if (scrollY >= last.top) return last.line;
    var lo = 0, hi = anchors.length - 1;
    while (lo + 1 < hi) {
      var mid = (lo + hi) >> 1;
      if (anchors[mid].top <= scrollY) lo = mid; else hi = mid;
    }
    var a = anchors[lo], b = anchors[hi];
    if (b.top === a.top) return a.line;
    return a.line + (b.line - a.line) * (scrollY - a.top) / (b.top - a.top);
  }

  function scrollToLine(line) {
    if (anchors.length === 0) return;
    var first = anchors[0], last = anchors[anchors.length - 1];
    var targetY;
    if (line <= first.line) {
      targetY = first.top;
    } else if (line >= last.line) {
      targetY = last.top;
    } else {
      var lo = 0, hi = anchors.length - 1;
      while (lo + 1 < hi) {
        var mid = (lo + hi) >> 1;
        if (anchors[mid].line <= line) lo = mid; else hi = mid;
      }
      var a = anchors[lo], b = anchors[hi];
      var frac = (b.line === a.line) ? 0 : (line - a.line) / (b.line - a.line);
      targetY = a.top + (b.top - a.top) * frac;
    }
    // Suppress scroll reporting for duration of smooth scroll (approx 400ms)
    suppressUntil = Date.now() + 400;
    window.scrollTo({ top: targetY, behavior: 'smooth' });
  }

  // Report preview scroll back to editor
  window.addEventListener('scroll', function() {
    if (Date.now() < suppressUntil) return;
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(function() {
      rafId = null;
      var scrollY = window.pageYOffset || 0;
      var line = lineForScroll(scrollY);
      if (Math.abs(line - lastReportedLine) > 0.1) {
        window.parent.postMessage({ type: 'previewScroll', line: line }, '*');
        lastReportedLine = line;
      }
    });
  }, { passive: true });

  // Rebuild anchors after content changes
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(scheduleRebuild).observe(document.body);
  }

  window.__miaoyanSync = {
    rebuild: rebuildAnchors,
    scrollToLine: scrollToLine,
    lineForScroll: lineForScroll
  };
})();

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'setContent') {
    _rawMode = !!e.data.raw;
    if (_domReady) {
      setContent(e.data.html, e.data.isDark, e.data.previewWidth);
    } else {
      _pendingHtml = e.data.html;
      _pendingDark = e.data.isDark;
    }
  } else if (e.data.type === 'applyTheme') {
    applyTheme(e.data.isDark);
  } else if (e.data.type === 'applyPreviewWidth') {
    applyPreviewWidth(e.data.previewWidth);
  } else if (e.data.type === 'scrollToLine') {
    if (window.__miaoyanSync) window.__miaoyanSync.scrollToLine(e.data.line);
  } else if (e.data.type === 'getHeadings') {
    window.parent.postMessage({ type: 'headings', headings: getHeadings() }, '*');
  }
});

function getHeadings() {
  var headings = [];
  document.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function(el) {
    headings.push({ level: parseInt(el.tagName[1]), text: el.textContent.trim(), id: el.id || el.textContent.trim() });
  });
  return headings;
}

/* ── Annotation Module ── */
(function() {
  var annotationMode = false;
  var popupEl = null;

  // Dismiss popup
  function dismissPopup() {
    if (popupEl) { popupEl.remove(); popupEl = null; }
  }

  // Show floating action popup near selection
  function showSelectionPopup(text, heading, paragraphIndex, rect) {
    dismissPopup();
    var popup = document.createElement('div');
    popup.className = 'ann-popup';

    var btnCopy = document.createElement('button');
    btnCopy.textContent = '复制';
    btnCopy.onclick = function(e) {
      e.stopPropagation();
      navigator.clipboard.writeText(text).then(function() {
        window.parent.postMessage({ type: 'annotation-copy' }, '*');
      }).catch(function(){});
      dismissPopup();
    };

    var btnAnnotate = document.createElement('button');
    btnAnnotate.textContent = '批注';
    btnAnnotate.onclick = function(e) {
      e.stopPropagation();
      window.parent.postMessage({
        type: 'annotation-selection',
        quote: text,
        heading: heading,
        paragraphIndex: paragraphIndex,
        rect: { top: rect.top, left: rect.left, bottom: rect.bottom }
      }, '*');
      dismissPopup();
    };

    popup.appendChild(btnCopy);
    popup.appendChild(btnAnnotate);
    document.body.appendChild(popup);
    popupEl = popup;

    // Position popup above selection, centered horizontally
    var pw = popup.offsetWidth;
    var left = rect.left + (rect.right - rect.left) / 2 - pw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    var top = rect.top - 38;
    if (top < 4) top = rect.bottom + 6;
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  // Find nearest heading for a given element
  function findNearestHeading(el) {
    var node = el;
    while (node && node.id !== 'write') {
      var prev = node.previousElementSibling;
      while (prev) {
        if (/^H[1-6]$/.test(prev.tagName)) return prev.textContent.trim();
        prev = prev.previousElementSibling;
      }
      node = node.parentElement;
    }
    return '';
  }

  // Find paragraph index of an element
  function findParagraphIndex(el) {
    var write = document.getElementById('write');
    if (!write) return 0;
    var blocks = write.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li, blockquote, pre, table');
    var node = el;
    while (node && node.parentElement !== write) node = node.parentElement;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i] === node || blocks[i].contains(el)) return i;
    }
    return 0;
  }

  // Listen for text selection — show popup instead of immediately sending
  document.addEventListener('mouseup', function(e) {
    if (!annotationMode) return;
    // Ignore clicks inside the popup itself
    if (popupEl && popupEl.contains(e.target)) return;
    dismissPopup();

    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) return;

    var text = sel.toString().trim();
    if (text.length < 2) return;

    var range = sel.getRangeAt(0);
    var anchor = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
    var heading = findNearestHeading(anchor);
    var paragraphIndex = findParagraphIndex(anchor);
    var rect = range.getBoundingClientRect();

    showSelectionPopup(text, heading, paragraphIndex, rect);
  });

  // Dismiss popup on click outside / Escape
  document.addEventListener('mousedown', function(e) {
    if (popupEl && !popupEl.contains(e.target)) dismissPopup();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') dismissPopup();
  });

  // Highlight annotations in rendered content
  function highlightAnnotations(annotations) {
    // Remove existing highlights
    document.querySelectorAll('.ann-hl, .ann-hl-resolved').forEach(function(el) {
      var parent = el.parentNode;
      parent.replaceChild(document.createTextNode(el.textContent), el);
      parent.normalize();
    });

    if (!annotations || annotations.length === 0) return;

    var write = document.getElementById('write');
    if (!write) return;

    annotations.forEach(function(ann) {
      highlightQuote(write, ann.quote, ann.id, ann.status === 'resolved');
    });
  }

  // Search and wrap quote text with highlight mark
  function highlightQuote(root, quote, id, isResolved) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    // Try to find the quote in text nodes
    var searchStr = quote.length > 60 ? quote.substring(0, 60) : quote;
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var idx = node.textContent.indexOf(searchStr);
      if (idx >= 0) {
        try {
          var range = document.createRange();
          range.setStart(node, idx);
          range.setEnd(node, idx + searchStr.length);
          var mark = document.createElement('mark');
          mark.className = isResolved ? 'ann-hl ann-hl-resolved' : 'ann-hl';
          mark.dataset.annId = id;
          range.surroundContents(mark);
          mark.addEventListener('click', function() {
            window.parent.postMessage({ type: 'annotation-click', id: id }, '*');
          });
        } catch(e) { /* skip if range crosses element boundaries */ }
        return;
      }
    }
  }

  // Handle messages from parent
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'setAnnotationMode') {
      annotationMode = e.data.enabled;
      document.body.style.cursor = annotationMode ? 'text' : '';
      if (!annotationMode) dismissPopup();
    } else if (e.data.type === 'renderAnnotations') {
      highlightAnnotations(e.data.annotations);
    } else if (e.data.type === 'scrollToAnnotation') {
      var el = document.querySelector('[data-ann-id="' + e.data.id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
})();
</script>
</body>
</html>
